name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build app bundle
        run: scripts/build-app.sh --native
      - uses: actions/upload-artifact@v4
        with:
          name: AirBar-${{ github.sha }}
          path: dist/*.zip
          retention-days: 14
