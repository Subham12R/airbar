name: Feature request
description: Suggest an idea for AirBar
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could AirBar help?
  - type: input
    id: model
    attributes:
      label: AC model (if relevant)
